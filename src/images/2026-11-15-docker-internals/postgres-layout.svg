<svg viewBox="0 0 1240 680" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="A PostgreSQL container in a cgroup with memory, CPU and PID limits, its memory budget split between shared buffers, work memory, page cache and /dev/shm, separate volumes for data, WAL and archive, and a metrics sidecar sharing its network namespace" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a778e8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fe3a1"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2707f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0b45f"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7db8f0"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63d8c8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f077b6"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b84a2"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3cb6a"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8d4e4"/></marker></defs><rect x="0" y="0" width="1240" height="680" rx="14" fill="#12101c" stroke="#2e2547" stroke-width="1.5"/><circle cx="26" cy="24" r="5" fill="#f2707f"/><circle cx="44" cy="24" r="5" fill="#f0b45f"/><circle cx="62" cy="24" r="5" fill="#6fe3a1"/><text x="620.0" y="29" text-anchor="middle" fill="#8b84a2" font-size="13">PostgreSQL in a container, every layer at once</text><line x1="0" y1="42" x2="1240" y2="42" stroke="#2e2547" stroke-width="1"/><rect x="30" y="58" width="760" height="600" rx="14" fill="#171226" stroke="#f0b45f" stroke-width="1.8" stroke-dasharray="8 6"/><text x="50" y="84" fill="#f0b45f" font-size="15" text-anchor="start" font-weight="bold" xml:space="preserve">pg-prod · docker-&lt;id&gt;.scope</text><text x="770" y="84" fill="#8b84a2" font-size="12" text-anchor="end" xml:space="preserve">memory.max 4G · cpu.max 2 cores · pids.max 512</text><rect x="50" y="104" width="720" height="176" rx="10" fill="#12101c" stroke="#6fe3a1" stroke-width="1.6"/><text x="70" y="130" fill="#6fe3a1" font-size="13" text-anchor="start" font-weight="bold" xml:space="preserve">processes (own pid namespace, UID 999 inside and out)</text><text x="70" y="156" fill="#d8d4e4" font-size="13" text-anchor="start" xml:space="preserve">postgres  (postmaster, PID 1)</text><text x="70" y="175" fill="#8b84a2" font-size="13" text-anchor="start" xml:space="preserve">├─ checkpointer</text><text x="70" y="194" fill="#8b84a2" font-size="13" text-anchor="start" xml:space="preserve">├─ background writer</text><text x="70" y="213" fill="#8b84a2" font-size="13" text-anchor="start" xml:space="preserve">├─ walwriter</text><text x="70" y="232" fill="#8b84a2" font-size="13" text-anchor="start" xml:space="preserve">├─ autovacuum launcher</text><text x="70" y="251" fill="#8b84a2" font-size="13" text-anchor="start" xml:space="preserve">└─ backend per connection</text><text x="420" y="156" fill="#f077b6" font-size="12.5" text-anchor="start" xml:space="preserve">an OOM kill of any backend</text><text x="420" y="175" fill="#f077b6" font-size="12.5" text-anchor="start" xml:space="preserve">makes the postmaster drop</text><text x="420" y="194" fill="#f077b6" font-size="12.5" text-anchor="start" xml:space="preserve">every connection and run</text><text x="420" y="213" fill="#f077b6" font-size="12.5" text-anchor="start" xml:space="preserve">crash recovery from the WAL</text><text x="50" y="316" fill="#d8d4e4" font-size="13.5" text-anchor="start" font-weight="bold" xml:space="preserve">the 4 GB memory budget, all charged to this cgroup</text><rect x="50" y="330" width="176.0" height="46" rx="6" fill="#12101c" stroke="#a778e8" stroke-width="2"/><text x="138.0" y="358" fill="#a778e8" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">shared_buffers 1G</text><rect x="230.0" y="330" width="104.0" height="46" rx="6" fill="#12101c" stroke="#7db8f0" stroke-width="2"/><text x="282.0" y="358" fill="#7db8f0" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">work_mem</text><rect x="338.0" y="330" width="247.99999999999997" height="46" rx="6" fill="#12101c" stroke="#63d8c8" stroke-width="2"/><text x="462.0" y="358" fill="#63d8c8" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">page cache (counts!)</text><rect x="590.0" y="330" width="121.99999999999999" height="46" rx="6" fill="#12101c" stroke="#f077b6" stroke-width="2"/><text x="651.0" y="358" fill="#f077b6" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">/dev/shm</text><rect x="716.0" y="330" width="50.0" height="46" rx="6" fill="#12101c" stroke="#2e2547" stroke-width="2"/><text x="770" y="396" fill="#8b84a2" font-size="11.5" text-anchor="end" xml:space="preserve">headroom</text><text x="50" y="396" fill="#8b84a2" font-size="11.5" text-anchor="start" xml:space="preserve">--shm-size 1g for parallel query · effective_cache_size = what&#x27;s left for cache</text><text x="50" y="440" fill="#d8d4e4" font-size="13.5" text-anchor="start" font-weight="bold" xml:space="preserve">mount namespace</text><text x="200" y="440" fill="#8b84a2" font-size="11.5" text-anchor="start" xml:space="preserve">overlay / for binaries, volumes for anything that must survive</text><rect x="50" y="462" width="330" height="36" rx="8" fill="#12101c" stroke="#63d8c8" stroke-width="1.6"/><text x="66" y="485" fill="#63d8c8" font-size="13.5" text-anchor="start" font-weight="bold" xml:space="preserve">/var/lib/postgresql</text><rect x="50" y="512" width="330" height="36" rx="8" fill="#12101c" stroke="#7db8f0" stroke-width="1.6"/><text x="66" y="535" fill="#7db8f0" font-size="13.5" text-anchor="start" font-weight="bold" xml:space="preserve">/pgwal</text><rect x="50" y="562" width="330" height="36" rx="8" fill="#12101c" stroke="#a778e8" stroke-width="1.6"/><text x="66" y="585" fill="#a778e8" font-size="13.5" text-anchor="start" font-weight="bold" xml:space="preserve">/pgarchive</text><rect x="50" y="612" width="330" height="36" rx="8" fill="#12101c" stroke="#f0b45f" stroke-width="1.6"/><text x="66" y="635" fill="#f0b45f" font-size="13.5" text-anchor="start" font-weight="bold" xml:space="preserve">/run/secrets/pg_pass  (ro)</text><text x="400" y="628" fill="#f0b45f" font-size="12" text-anchor="start" xml:space="preserve">bind mount for POSTGRES_PASSWORD_FILE</text><rect x="830" y="58" width="380" height="120" rx="12" fill="#171226" stroke="#63d8c8" stroke-width="1.6"/><text x="850" y="84" fill="#63d8c8" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">pg-metrics sidecar</text><text x="850" y="108" fill="#d8d4e4" font-size="12.5" text-anchor="start" xml:space="preserve">postgres-exporter</text><text x="850" y="127" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">--network container:pg-prod</text><text x="850" y="146" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">scrapes localhost:5432, pod style</text><line x1="830" y1="150" x2="772" y2="190" stroke="#63d8c8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-teal)"/><text x="830" y="212" fill="#6fe3a1" font-size="12.5" text-anchor="start" xml:space="preserve">-p 127.0.0.1:5432:5432 for local clients</text><rect x="860" y="260" width="340" height="76" rx="10" fill="#1f1833" stroke="#63d8c8" stroke-width="2"/><text x="1030.0" y="295.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">pgprod-data</text><text x="1030.0" y="312.0" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">tables, indexes</text><rect x="860" y="370" width="340" height="76" rx="10" fill="#1f1833" stroke="#7db8f0" stroke-width="2"/><text x="1030.0" y="405.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">pgprod-wal</text><text x="1030.0" y="422.0" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">pg_wal (pg_xlog before 10)</text><rect x="860" y="480" width="340" height="76" rx="10" fill="#1f1833" stroke="#a778e8" stroke-width="2"/><text x="1030.0" y="515.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">pgprod-archive</text><text x="1030.0" y="532.0" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">WAL segments for PITR</text><path d="M 380 480 C 640 480, 660 298, 856 298" fill="none" stroke="#63d8c8" stroke-width="1.6" marker-end="url(#a-teal)"/><path d="M 380 530 C 640 530, 660 408, 856 408" fill="none" stroke="#7db8f0" stroke-width="1.6" marker-end="url(#a-blue)"/><path d="M 380 580 C 640 580, 660 518, 856 518" fill="none" stroke="#a778e8" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="1030" y="600" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">WAL on its own disk in real life:</text><text x="1030" y="616" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">sequential and latency sensitive</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
