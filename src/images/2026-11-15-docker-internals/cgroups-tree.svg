<svg viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="cgroup v1 keeps a separate hierarchy per controller, cgroup v2 has one unified tree with each container in a single scope" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a778e8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fe3a1"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2707f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0b45f"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7db8f0"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63d8c8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f077b6"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b84a2"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3cb6a"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8d4e4"/></marker></defs><rect x="0" y="0" width="1240" height="560" rx="14" fill="#12101c" stroke="#2e2547" stroke-width="1.5"/><circle cx="26" cy="24" r="5" fill="#f2707f"/><circle cx="44" cy="24" r="5" fill="#f0b45f"/><circle cx="62" cy="24" r="5" fill="#6fe3a1"/><text x="620.0" y="29" text-anchor="middle" fill="#8b84a2" font-size="13">cgroup v1 vs cgroup v2</text><line x1="0" y1="42" x2="1240" y2="42" stroke="#2e2547" stroke-width="1"/><rect x="30" y="58" width="560" height="482" rx="12" fill="#171226" stroke="#2e2547" stroke-width="1.2"/><text x="50" y="86" fill="#f0b45f" font-size="17" text-anchor="start" font-weight="bold" xml:space="preserve">cgroup v1</text><text x="50" y="106" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">one tree per controller, kept in sync by nobody</text><rect x="630" y="58" width="580" height="482" rx="12" fill="#171226" stroke="#63d8c8" stroke-width="1.6"/><text x="650" y="86" fill="#63d8c8" font-size="17" text-anchor="start" font-weight="bold" xml:space="preserve">cgroup v2</text><text x="650" y="106" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">one tree, every controller in the same node</text><text x="50" y="146" fill="#f0b45f" font-size="14" text-anchor="start" xml:space="preserve">/sys/fs/cgroup/cpu/</text><text x="50" y="168" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">├─ scans/</text><text x="50" y="190" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">│  ├─ nmap/</text><text x="50" y="212" fill="#6fe3a1" font-size="14" text-anchor="start" xml:space="preserve">│  └─ 48213</text><text x="50" y="234" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">└─ services/</text><text x="50" y="256" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">   ├─ nginx/</text><text x="50" y="278" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">   └─ sshd/</text><text x="320" y="146" fill="#f0b45f" font-size="14" text-anchor="start" xml:space="preserve">/sys/fs/cgroup/memory/</text><text x="320" y="168" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">├─ docker/</text><text x="320" y="190" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">│  └─ 3f9c…/</text><text x="320" y="212" fill="#6fe3a1" font-size="14" text-anchor="start" xml:space="preserve">│     └─ 48213</text><text x="320" y="234" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">└─ lab/</text><text x="320" y="256" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">   ├─ 2201</text><text x="320" y="278" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">   └─ 2207</text><path d="M 155 212 C 210 330, 300 330, 395 212" fill="none" stroke="#f077b6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-pink)"/><text x="275" y="334" fill="#f077b6" font-size="13" text-anchor="middle" font-weight="bold" xml:space="preserve">same PID, different place</text><text x="275" y="352" fill="#f077b6" font-size="13" text-anchor="middle" font-weight="bold" xml:space="preserve">in every tree</text><text x="50" y="412" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">+ blkio/, pids/, devices/, freezer/, net_cls/, hugetlb/ …</text><text x="50" y="430" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">each its own hierarchy, mounted separately</text><text x="50" y="470" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">files: memory.limit_in_bytes, cpu.shares,</text><text x="50" y="488" fill="#8b84a2" font-size="12.5" text-anchor="start" xml:space="preserve">blkio.throttle.*, tasks</text><text x="650" y="146" fill="#63d8c8" font-size="14" text-anchor="start" xml:space="preserve">/sys/fs/cgroup/</text><text x="650" y="168" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">├─ init.scope</text><text x="650" y="190" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">├─ user.slice/</text><text x="650" y="212" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">└─ system.slice/</text><text x="650" y="234" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">   ├─ docker.service         dockerd, docker-proxy</text><text x="650" y="256" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">   ├─ containerd.service</text><text x="650" y="278" fill="#6fe3a1" font-size="14" text-anchor="start" xml:space="preserve">   ├─ docker-3f9c….scope/</text><rect x="690" y="300" width="490" height="150" rx="10" fill="#12101c" stroke="#6fe3a1" stroke-width="1.6"/><text x="706" y="324" fill="#6fe3a1" font-size="13.5" text-anchor="start" font-weight="bold" xml:space="preserve">48213 sleep 31337        (cgroup.procs)</text><rect x="706" y="340" width="92.4" height="24" rx="12.0" fill="#171226" stroke="#a778e8" stroke-width="1.3"/><text x="752.2" y="355.96" fill="#a778e8" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">memory.max</text><rect x="806.4" y="340" width="92.4" height="24" rx="12.0" fill="#171226" stroke="#a778e8" stroke-width="1.3"/><text x="852.6" y="355.96" fill="#a778e8" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">memory.low</text><rect x="906.8" y="340" width="114.72" height="24" rx="12.0" fill="#171226" stroke="#a778e8" stroke-width="1.3"/><text x="964.16" y="355.96" fill="#a778e8" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">memory.events</text><rect x="1029.52" y="340" width="70.08" height="24" rx="12.0" fill="#171226" stroke="#7db8f0" stroke-width="1.3"/><text x="1064.56" y="355.96" fill="#7db8f0" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">cpu.max</text><rect x="706" y="372" width="92.4" height="24" rx="12.0" fill="#171226" stroke="#7db8f0" stroke-width="1.3"/><text x="752.2" y="387.96" fill="#7db8f0" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">cpu.weight</text><rect x="806.4" y="372" width="62.64" height="24" rx="12.0" fill="#171226" stroke="#f0b45f" stroke-width="1.3"/><text x="837.72" y="387.96" fill="#f0b45f" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">io.max</text><rect x="877.04" y="372" width="77.52" height="24" rx="12.0" fill="#171226" stroke="#f077b6" stroke-width="1.3"/><text x="915.8" y="387.96" fill="#f077b6" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">pids.max</text><rect x="962.56" y="372" width="114.72" height="24" rx="12.0" fill="#171226" stroke="#63d8c8" stroke-width="1.3"/><text x="1019.92" y="387.96" fill="#63d8c8" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">cgroup.freeze</text><rect x="706" y="404" width="129.6" height="24" rx="12.0" fill="#171226" stroke="#a778e8" stroke-width="1.3"/><text x="770.8" y="419.96" fill="#a778e8" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">memory.pressure</text><text x="650" y="476" fill="#d8d4e4" font-size="14" text-anchor="start" xml:space="preserve">   └─ docker-a1b2….scope/</text><text x="650" y="516" fill="#63d8c8" font-size="13" text-anchor="start" font-weight="bold" xml:space="preserve">the process lives in exactly one node</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
