xt x="825" y="185" fill="#f0b45f" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">edited</text><rect x="885" y="160" width="90" height="40" rx="7" fill="none" stroke="#f077b6" stroke-width="1.2" stroke-dasharray="3 4"/><text x="930" y="185" fill="#f077b6" font-size="12" text-anchor="middle" xml:space="preserve">hidden</text><rect x="990" y="160" width="90" height="40" rx="7" fill="#171226" stroke="#6fe3a1" stroke-width="1.6"/><text x="1035" y="185" fill="#6fe3a1" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">new file</text><rect x="1095" y="160" width="90" height="40" rx="7" fill="#171226" stroke="#7db8f0" stroke-width="1.6"/><text x="1140" y="185" fill="#7db8f0" font-size="12" text-anchor="middle" font-weight="bold" xml:space="preserve">binary</text><line x1="825" y1="380" x2="825" y2="312" stroke="#f0b45f" stroke-width="1.8" marker-end="url(#a-amber)"/><line x1="1140" y1="380" x2="1140" y2="202" stroke="#7db8f0" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-blue)"/><rect x="610" y="460" width="14" height="14" rx="3" fill="none" stroke="#f0b45f" stroke-width="2"/><text x="632" y="472" fill="#d8d4e4" font-size="12.5" text-anchor="start" xml:space="preserve">copy up on first write</text><rect x="910" y="460" width="14" height="14" rx="3" fill="none" stroke="#f077b6" stroke-width="2"/><text x="932" y="472" fill="#d8d4e4" font-size="12.5" text-anchor="start" xml:space="preserve">whiteout hides a deleted file</text><rect x="610" y="488" width="14" height="14" rx="3" fill="none" stroke="#6fe3a1" stroke-width="2"/><text x="632" y="500" fill="#d8d4e4" font-size="12.5" text-anchor="start" xml:space="preserve">new files live only in upper</text><rect x="910" y="488" width="14" height="14" rx="3" fill="none" stroke="#7db8f0" stroke-width="2"/><text x="932" y="500" fill="#d8d4e4" font-size="12.5" text-anchor="start" xml:space="preserve">untouched files read through</text><text x="610" y="552" fill="#8b84a