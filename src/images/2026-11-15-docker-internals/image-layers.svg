>container 3</text><text x="450" y="147" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">thin rw layer</text><line x1="450" y1="154" x2="450" y2="186" stroke="#6fe3a1" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a-green)"/><rect x="60" y="192" width="460" height="58" rx="8" fill="#12101c" stroke="#8b84a2" stroke-width="1.8" stroke-dasharray="5 4"/><text x="78" y="217" fill="#d8d4e4" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">EXPOSE 80 · CMD [...]</text><text x="78" y="236" fill="#8b84a2" font-size="12" text-anchor="start" xml:space="preserve">config only, 0 B, no layer</text><text x="502" y="226" fill="#8b84a2" font-size="12" text-anchor="end" xml:space="preserve"></text><rect x="60" y="260" width="460" height="58" rx="8" fill="#1f1833" stroke="#a778e8" stroke-width="1.8"/><text x="78" y="285" fill="#d8d4e4" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">RUN apt-get install nginx</text><text x="78" y="304" fill="#8b84a2" font-size="12" text-anchor="start" xml:space="preserve">only the files it changed</text><text x="502" y="294" fill="#a778e8" font-size="12" text-anchor="end" xml:space="preserve">sha256:…</text><rect x="60" y="328" width="460" height="58" rx="8" fill="#1f1833" stroke="#f0b45f" stroke-width="1.8"/><text x="78" y="353" fill="#d8d4e4" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">RUN apt-get update</text><text x="78" y="372" fill="#8b84a2" font-size="12" text-anchor="start" xml:space="preserve">package lists, dead weight</text><text x="502" y="362" fill="#f0b45f" font-size="12" text-anchor="end" xml:space="preserve">sha256:…</text><rect x="60" y="396" width="460" height="58" rx="8" fill="#1f1833" stroke="#7db8f0" stroke-width="1.8"/><text x="78" y="421" fill="#d8d4e4" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">FROM debian:trixie-slim</text><text x="78" y="440" fill="#8b84a2" font-size="12" tex