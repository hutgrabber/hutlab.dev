<svg viewBox="0 0 1240 480" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="The docker CLI calls dockerd over a Unix socket, dockerd calls containerd over gRPC, containerd starts a shim, the shim runs runc, and runc starts the process and exits, leaving the shim as its parent" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a778e8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fe3a1"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2707f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0b45f"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7db8f0"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63d8c8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f077b6"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b84a2"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3cb6a"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8d4e4"/></marker></defs><rect x="0" y="0" width="1240" height="480" rx="14" fill="#12101c" stroke="#2e2547" stroke-width="1.5"/><circle cx="26" cy="24" r="5" fill="#f2707f"/><circle cx="44" cy="24" r="5" fill="#f0b45f"/><circle cx="62" cy="24" r="5" fill="#6fe3a1"/><text x="620.0" y="29" text-anchor="middle" fill="#8b84a2" font-size="13">what actually happens on docker run</text><line x1="0" y1="42" x2="1240" y2="42" stroke="#2e2547" stroke-width="1"/><rect x="30" y="96" width="160" height="84" rx="10" fill="#1f1833" stroke="#d8d4e4" stroke-width="2"/><text x="110.0" y="135.0" fill="#d8d4e4" font-size="16" text-anchor="middle" font-weight="bold" xml:space="preserve">docker</text><text x="110.0" y="152.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">the CLI, an</text><text x="110.0" y="167.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">HTTP client</text><rect x="280" y="96" width="160" height="84" rx="10" fill="#1f1833" stroke="#a778e8" stroke-width="2"/><text x="360.0" y="135.0" fill="#d8d4e4" font-size="16" text-anchor="middle" font-weight="bold" xml:space="preserve">dockerd</text><text x="360.0" y="152.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">listens on</text><text x="360.0" y="167.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">docker.sock</text><rect x="530" y="96" width="160" height="84" rx="10" fill="#1f1833" stroke="#63d8c8" stroke-width="2"/><text x="610.0" y="135.0" fill="#d8d4e4" font-size="16" text-anchor="middle" font-weight="bold" xml:space="preserve">containerd</text><text x="610.0" y="152.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">listens on</text><text x="610.0" y="167.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">containerd.sock</text><rect x="780" y="96" width="180" height="84" rx="10" fill="#1f1833" stroke="#6fe3a1" stroke-width="2"/><text x="870.0" y="135.0" fill="#d8d4e4" font-size="16" text-anchor="middle" font-weight="bold" xml:space="preserve">shim</text><text x="870.0" y="152.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">containerd-shim-runc-v2</text><text x="870.0" y="167.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">one per container</text><rect x="1030" y="96" width="180" height="84" rx="10" fill="#1f1833" stroke="#f0b45f" stroke-width="2" stroke-dasharray="6 5"/><text x="1120.0" y="135.0" fill="#d8d4e4" font-size="16" text-anchor="middle" font-weight="bold" xml:space="preserve">runc</text><text x="1120.0" y="152.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">create, start,</text><text x="1120.0" y="167.0" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">then exits</text><line x1="192" y1="138" x2="276" y2="138" stroke="#8b84a2" stroke-width="1.8" marker-end="url(#a-muted)"/><text x="235.0" y="128" fill="#c39bf5" font-size="11.5" text-anchor="middle" font-weight="bold" xml:space="preserve">HTTP</text><line x1="442" y1="138" x2="526" y2="138" stroke="#8b84a2" stroke-width="1.8" marker-end="url(#a-muted)"/><text x="485.0" y="128" fill="#c39bf5" font-size="11.5" text-anchor="middle" font-weight="bold" xml:space="preserve">gRPC</text><line x1="692" y1="138" x2="776" y2="138" stroke="#8b84a2" stroke-width="1.8" marker-end="url(#a-muted)"/><text x="735.0" y="128" fill="#c39bf5" font-size="11.5" text-anchor="middle" font-weight="bold" xml:space="preserve">fork/exec</text><line x1="962" y1="138" x2="1026" y2="138" stroke="#8b84a2" stroke-width="1.8" marker-end="url(#a-muted)"/><text x="995.0" y="128" fill="#c39bf5" font-size="11.5" text-anchor="middle" font-weight="bold" xml:space="preserve">exec</text><rect x="770" y="300" width="200" height="70" rx="10" fill="#1f1833" stroke="#6fe3a1" stroke-width="2"/><text x="870.0" y="332.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">your process</text><text x="870.0" y="349.0" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">PID 48213</text><line x1="870" y1="180" x2="870" y2="296" stroke="#6fe3a1" stroke-width="2.2" marker-end="url(#a-green)"/><text x="882" y="232" fill="#6fe3a1" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve">parent: holds stdio,</text><text x="882" y="248" fill="#6fe3a1" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve">collects the exit code</text><path d="M 1120 180 C 1120 260, 1050 335, 974 335" fill="none" stroke="#f0b45f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-amber)"/><text x="1000" y="362" fill="#f0b45f" font-size="11.5" text-anchor="start" xml:space="preserve">clone() + namespaces</text><text x="1000" y="376" fill="#f0b45f" font-size="11.5" text-anchor="start" xml:space="preserve">cgroup, pivot_root,</text><text x="1000" y="390" fill="#f0b45f" font-size="11.5" text-anchor="start" xml:space="preserve">seccomp, then exec</text><rect x="280" y="222" width="410" height="76" rx="10" fill="#171226" stroke="#2e2547" stroke-width="1.2"/><text x="480" y="248" fill="#d8d4e4" font-size="13" text-anchor="middle" font-weight="bold" xml:space="preserve">dockerd and containerd can restart</text><text x="480" y="268" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">&quot;live-restore&quot;: true keeps containers running,</text><text x="480" y="284" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">because the shim, not the daemon, is the parent</text><rect x="30" y="410" width="1180" height="46" rx="8" fill="#0d0b12" stroke="#2e2547" stroke-width="1.2"/><text x="50" y="438" fill="#6fe3a1" font-size="13.5" text-anchor="start" xml:space="preserve">$ pstree -s -p 48213</text><text x="260" y="438" fill="#d8d4e4" font-size="13.5" text-anchor="start" xml:space="preserve">systemd(1)───containerd-shim(2817)───sleep(48213)</text><text x="1190" y="438" fill="#8b84a2" font-size="12.5" text-anchor="end" xml:space="preserve">no dockerd, no runc</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
