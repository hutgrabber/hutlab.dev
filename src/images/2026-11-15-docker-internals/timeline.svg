,0 L10,5 L0,10 z" fill="#d8d4e4"/></marker></defs><rect x="0" y="0" width="1240" height="400" rx="14" fill="#12101c" stroke="#2e2547" stroke-width="1.5"/><circle cx="26" cy="24" r="5" fill="#f2707f"/><circle cx="44" cy="24" r="5" fill="#f0b45f"/><circle cx="62" cy="24" r="5" fill="#6fe3a1"/><text x="620.0" y="29" text-anchor="middle" fill="#8b84a2" font-size="13">forty-ish years of telling processes they&#x27;re alone</text><line x1="0" y1="42" x2="1240" y2="42" stroke="#2e2547" stroke-width="1"/><line x1="40" y1="205" x2="1200" y2="205" stroke="#2e2547" stroke-width="3"/><text x="1200" y="64" fill="#8b84a2" font-size="12" text-anchor="end" font-style="italic" xml:space="preserve">not to scale</text><circle cx="70.0" cy="205" r="7" fill="#12101c" stroke="#7db8f0" stroke-width="2.5"/><line x1="70.0" y1="196" x2="70.0" y2="150" stroke="#7db8f0" stroke-width="1.2"/><text x="70.0" y="140" fill="#7db8f0" font-size="14" text-anchor="middle" font-weight="bold" xml:space="preserve">1979</text><text x="70.0" y="120" fill="#d8d4e4" font-size="13" text-anchor="middle" font-weight="bold" xml:space="preserve">chroot</text><text x="70.0" y="102" fill="#8b84a2" font-size="11.5" text-anchor="middle" xml:space="preserve">Unix V7</text><circle cx="154.6153846153846" cy="205" r="7" fill="#12101c" stroke="#7db8f0" stroke-width="2.5"/><line x1="154.6153846153846" y1="214" x2="154.6153846153846" y2="258" stroke="#7db8f0" stroke-width="1.2"/><text x="154.6153846153846" y="276" fill="#7db8f0" font-size="14" text-anchor="middle" font-weight="bold" xml:space="preserve">2000</text><text x="154.6153846153846" y="296" fill="#d8d4e4" font-size="13" text-anchor="middle" font-weight="bold" xml:space="preserve">FreeBSD jails</text><circle cx="239.23076923076923" cy="205" r="7" fill="#12101c" stroke="#7db8f0" stroke-width="2.5"/><line x1="239.23076923076923" y1="196" x2="239.23076923076923" y2="150" stroke="#7db8f0" stroke-width="1.2"/><text x="239.23076923076923" y="140" fill="#7db8f0" font-size="1