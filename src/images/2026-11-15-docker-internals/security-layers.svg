<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="Nested security layers around a container process: user namespace, capabilities, seccomp, AppArmor or SELinux and no-new-privileges, above the shared host kernel" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a778e8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fe3a1"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2707f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0b45f"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7db8f0"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63d8c8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f077b6"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b84a2"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3cb6a"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8d4e4"/></marker></defs><rect x="0" y="0" width="1100" height="620" rx="14" fill="#12101c" stroke="#2e2547" stroke-width="1.5"/><circle cx="26" cy="24" r="5" fill="#f2707f"/><circle cx="44" cy="24" r="5" fill="#f0b45f"/><circle cx="62" cy="24" r="5" fill="#6fe3a1"/><text x="550.0" y="29" text-anchor="middle" fill="#8b84a2" font-size="13">the filters between a container and the kernel</text><line x1="0" y1="42" x2="1100" y2="42" stroke="#2e2547" stroke-width="1"/><rect x="90.0" y="70.0" width="920" height="440" rx="22" fill="#171226" stroke="#7db8f0" stroke-width="2"/><text x="108.0" y="92.0" fill="#7db8f0" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">user namespace</text><text x="992.0" y="92.0" fill="#8b84a2" font-size="12" text-anchor="end" xml:space="preserve">root in here is UID 100000 out there  (opt in)</text><rect x="160.0" y="110.0" width="780" height="360" rx="22" fill="#12101c" stroke="#63d8c8" stroke-width="2"/><text x="178.0" y="132.0" fill="#63d8c8" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">capabilities</text><text x="922.0" y="132.0" fill="#8b84a2" font-size="12" text-anchor="end" xml:space="preserve">14 of ~41 kept by default</text><rect x="230.0" y="150.0" width="640" height="280" rx="22" fill="#12101c" stroke="#f0b45f" stroke-width="2"/><text x="248.0" y="172.0" fill="#f0b45f" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">seccomp</text><text x="852.0" y="172.0" fill="#8b84a2" font-size="12" text-anchor="end" xml:space="preserve">~44 of 300+ syscalls blocked</text><rect x="300.0" y="190.0" width="500" height="200" rx="22" fill="#12101c" stroke="#f077b6" stroke-width="2"/><text x="318.0" y="212.0" fill="#f077b6" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">AppArmor / SELinux</text><text x="782.0" y="212.0" fill="#8b84a2" font-size="12" text-anchor="end" xml:space="preserve">docker-default profile or svirt labels</text><rect x="370.0" y="230.0" width="360" height="120" rx="22" fill="#12101c" stroke="#e3cb6a" stroke-width="2"/><text x="388.0" y="252.0" fill="#e3cb6a" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">no-new-privileges</text><text x="712.0" y="252.0" fill="#8b84a2" font-size="12" text-anchor="end" xml:space="preserve">no setuid escalation</text><rect x="455" y="280" width="190" height="44" rx="12" fill="#1f1833" stroke="#6fe3a1" stroke-width="2.2"/><text x="550" y="307" fill="#6fe3a1" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">your process</text><rect x="90" y="548" width="920" height="46" rx="10" fill="#2a1830" stroke="#f077b6" stroke-width="2"/><text x="550" y="577" fill="#f077b6" font-size="14" text-anchor="middle" font-weight="bold" xml:space="preserve">shared host kernel, the thing every ring is protecting</text><line x1="550" y1="326" x2="550" y2="544" stroke="#6fe3a1" stroke-width="2" marker-end="url(#a-green)"/><text x="560" y="532" fill="#6fe3a1" font-size="12.5" text-anchor="start" font-weight="bold" xml:space="preserve">syscall</text><text x="90" y="532" fill="#f2707f" font-size="13" text-anchor="start" font-weight="bold" xml:space="preserve">--privileged turns off every ring</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
