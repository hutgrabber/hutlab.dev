<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="A container&#x27;s root is an overlay mount, while a named volume, a read-only bind mount and a tmpfs are separate mounts backed by the host or RAM" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a778e8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fe3a1"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2707f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0b45f"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7db8f0"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63d8c8"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f077b6"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b84a2"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3cb6a"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8d4e4"/></marker></defs><rect x="0" y="0" width="1200" height="500" rx="14" fill="#12101c" stroke="#2e2547" stroke-width="1.5"/><circle cx="26" cy="24" r="5" fill="#f2707f"/><circle cx="44" cy="24" r="5" fill="#f0b45f"/><circle cx="62" cy="24" r="5" fill="#6fe3a1"/><text x="600.0" y="29" text-anchor="middle" fill="#8b84a2" font-size="13">three ways around the union filesystem</text><line x1="0" y1="42" x2="1200" y2="42" stroke="#2e2547" stroke-width="1"/><rect x="30" y="58" width="1140" height="180" rx="12" fill="#171226" stroke="#6fe3a1" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50" y="84" fill="#6fe3a1" font-size="14" text-anchor="start" font-weight="bold" xml:space="preserve">container&#x27;s mount namespace</text><rect x="60" y="104" width="240" height="66" rx="10" fill="#1f1833" stroke="#a778e8" stroke-width="2"/><text x="180.0" y="134.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">/</text><text x="180.0" y="151.0" fill="#8b84a2" font-size="12.5" text-anchor="middle" xml:space="preserve">overlay</text><text x="180" y="200" fill="#a778e8" font-size="12.5" text-anchor="middle" font-weight="bold" xml:space="preserve">dies with the container</text><line x1="180" y1="210" x2="180" y2="300" stroke="#a778e8" stroke-width="1.8" marker-end="url(#a-accent)"/><rect x="60" y="304" width="240" height="70" rx="10" fill="#12101c" stroke="#a778e8" stroke-width="1.4"/><text x="180" y="334" fill="#d8d4e4" font-size="13" text-anchor="middle" xml:space="preserve">upperdir over</text><text x="180" y="352" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">lowerdir (image)</text><rect x="340" y="104" width="240" height="66" rx="10" fill="#1f1833" stroke="#63d8c8" stroke-width="2"/><text x="460.0" y="134.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">/var/lib/postgresql</text><text x="460.0" y="151.0" fill="#8b84a2" font-size="12.5" text-anchor="middle" xml:space="preserve">named volume</text><text x="460" y="200" fill="#63d8c8" font-size="12.5" text-anchor="middle" font-weight="bold" xml:space="preserve">survives docker rm</text><line x1="460" y1="210" x2="460" y2="300" stroke="#63d8c8" stroke-width="1.8" marker-end="url(#a-teal)"/><rect x="340" y="304" width="240" height="70" rx="10" fill="#12101c" stroke="#63d8c8" stroke-width="1.4"/><text x="460" y="334" fill="#d8d4e4" font-size="13" text-anchor="middle" xml:space="preserve">/var/lib/docker/</text><text x="460" y="352" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">volumes/pgdata/_data</text><rect x="620" y="104" width="240" height="66" rx="10" fill="#1f1833" stroke="#f0b45f" stroke-width="2"/><text x="740.0" y="134.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">/etc/app</text><text x="740.0" y="151.0" fill="#8b84a2" font-size="12.5" text-anchor="middle" xml:space="preserve">bind mount, :ro</text><text x="740" y="200" fill="#f0b45f" font-size="12.5" text-anchor="middle" font-weight="bold" xml:space="preserve">the host owns it</text><line x1="740" y1="210" x2="740" y2="300" stroke="#f0b45f" stroke-width="1.8" marker-end="url(#a-amber)"/><rect x="620" y="304" width="240" height="70" rx="10" fill="#12101c" stroke="#f0b45f" stroke-width="1.4"/><text x="740" y="334" fill="#d8d4e4" font-size="13" text-anchor="middle" xml:space="preserve">/srv/config</text><text x="740" y="352" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">(any host path)</text><rect x="900" y="104" width="240" height="66" rx="10" fill="#1f1833" stroke="#f077b6" stroke-width="2"/><text x="1020.0" y="134.0" fill="#d8d4e4" font-size="15" text-anchor="middle" font-weight="bold" xml:space="preserve">/cache</text><text x="1020.0" y="151.0" fill="#8b84a2" font-size="12.5" text-anchor="middle" xml:space="preserve">tmpfs</text><text x="1020" y="200" fill="#f077b6" font-size="12.5" text-anchor="middle" font-weight="bold" xml:space="preserve">gone when it stops</text><line x1="1020" y1="210" x2="1020" y2="300" stroke="#f077b6" stroke-width="1.8" marker-end="url(#a-pink)"/><rect x="900" y="304" width="240" height="70" rx="10" fill="#12101c" stroke="#f077b6" stroke-width="1.4"/><text x="1020" y="334" fill="#d8d4e4" font-size="13" text-anchor="middle" xml:space="preserve">RAM</text><text x="1020" y="352" fill="#8b84a2" font-size="12" text-anchor="middle" xml:space="preserve">(size=8m)</text><rect x="30" y="280" width="1140" height="110" rx="12" fill="none" stroke="#2e2547" stroke-width="1.2"/><text x="1150" y="300" fill="#8b84a2" font-size="12" text-anchor="end" letter-spacing="1" xml:space="preserve">host</text><text x="600" y="428" fill="#d8d4e4" font-size="13.5" text-anchor="middle" font-weight="bold" xml:space="preserve">only the first one goes through overlayfs and copy up</text><text x="600" y="452" fill="#8b84a2" font-size="12.5" text-anchor="middle" xml:space="preserve">docker commit, export and push skip everything else</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
