  <text x="164" y="236" font-size="14" fill="#6fe3a1"># The Foundation</text>
  <text x="164" y="262" font-size="14" fill="#d8d4e4">M1 Max, macOS, and a fight against x86 binaries.</text>
  <text x="164" y="290" font-size="14" fill="#f077b6"># The Toolkit</text>
  <text x="164" y="316" font-size="14" fill="#d8d4e4">zsh, starship, LazyVim, tmux, bat, and a wishlist.</text>
  <text x="164" y="344" font-size="14" fill="#7db8f0"># Managing and Version Control</text>
  <text x="164" y="370" font-size="14" fill="#d8d4e4">GNU Stow does the symlinking. git does the rest.</text>

