  <circle cx="206" cy="89" r="7" fill="#6fe3a1"/>
  <text x="500" y="94" fill="#8b84a2" font-size="13" text-anchor="middle">hutgrabber@m1max — zsh — tmux — nvim</text>

  <!-- content lines -->
  <text x="164" y="150" font-size="17"><tspan fill="#c39bf5">~/.dotfiles</tspan><tspan fill="#8b84a2"> on </tspan><tspan fill="#63d8c8">  main</tspan></text>
  <text x="164" y="180" font-size="18"><tspan fill="#a778e8">❯ </tspan><tspan fill="#d8d4e4">stow . &amp;&amp; nvim</tspan></text>

