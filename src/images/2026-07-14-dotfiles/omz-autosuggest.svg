<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'SF Mono', monospace">
  <rect width="700" height="300" rx="12" fill="#0d0b12"/>
  <rect x="1" y="1" width="698" height="298" rx="11" fill="#171226" stroke="#2e2547" stroke-width="1.5"/>
  <rect x="1" y="1" width="698" height="34" rx="11" fill="#1f1833"/>
  <rect x="1" y="24" width="698" height="11" fill="#1f1833"/>
  <circle cx="24" cy="18" r="6" fill="#f2707f"/>
  <circle cx="44" cy="18" r="6" fill="#f0b45f"/>
  <circle cx="64" cy="18" r="6" fill="#6fe3a1"/>
  <text x="350" y="22" fill="#8b84a2" font-size="12" text-anchor="middle">zsh-autosuggestions + zsh-syntax-highlighting</text>

  <text x="24" y="66" fill="#5a5470" font-size="11">as you type, before you press enter</text>
  <text x="24" y="92" font-size="16">
    <tspan fill="#a778e8">❯ </tspan>
    <tspan fill="#6fe3a1">ssh hutgra</tspan>
    <tspan fill="#3f3a52">bber@203.0.113.4 -p 2222</tspan>
  </text>
  <text x="24" y="112" fill="#5a5470" font-size="11">the greyed-out tail is a guess pulled straight from shell history, → accepts it</text>

  <line x1="24" y1="132" x2="676" y2="132" stroke="#2e2547"/>

  <text x="24" y="158" fill="#5a5470" font-size="11">a known command turns green as soon as it is typed</text>
  <text x="24" y="184" font-size="16">
    <tspan fill="#a778e8">❯ </tspan>
    <tspan fill="#6fe3a1">git status</tspan>
  </text>

  <line x1="24" y1="204" x2="676" y2="204" stroke="#2e2547"/>

  <text x="24" y="230" fill="#5a5470" font-size="11">a typo turns red before you even hit enter, no need to run it to find out</text>
  <text x="24" y="256" font-size="16">
    <tspan fill="#a778e8">❯ </tspan>
    <tspan fill="#f2707f" text-decoration="underline">gti status</tspan>
  </text>

  <text x="24" y="284" fill="#3a3450" font-size="10">$ZSH_CUSTOM/plugins, sourced before starship</text>
</svg>
