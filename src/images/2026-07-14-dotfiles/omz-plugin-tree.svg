<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'SF Mono', monospace">
  <rect width="700" height="420" fill="#0d0b12"/>

  <!-- folder tree -->
  <rect x="24" y="30" width="280" height="330" rx="10" fill="#171226" stroke="#2e2547" stroke-width="1.5"/>
  <text x="164" y="58" font-size="13" fill="#c39bf5" text-anchor="middle" font-weight="bold">$ZSH_CUSTOM = ~/.config/omz/</text>

  <text x="44" y="86" font-size="12" fill="#f0b45f">① hacking.zsh</text>
  <text x="44" y="112" font-size="12" fill="#f0b45f">② aliases.zsh</text>
  <text x="44" y="138" font-size="12" fill="#f0b45f">③ environment.zsh</text>
  <text x="44" y="164" font-size="12" fill="#d8d4e4">plugins/</text>
  <text x="60" y="188" font-size="12" fill="#63d8c8">zsh-syntax-highlighting/</text>
  <text x="60" y="210" font-size="12" fill="#63d8c8">zsh-autosuggestions/</text>
  <text x="44" y="240" font-size="12" fill="#5a5470">themes/  (unused, starship owns this)</text>

  <text x="44" y="300" font-size="11" fill="#5a5470">not the real oh-my-zsh install dir,</text>
  <text x="44" y="320" font-size="11" fill="#5a5470">a folder in the dotfiles repo instead,</text>
  <text x="44" y="340" font-size="11" fill="#5a5470">so an update never touches it.</text>

  <!-- arrow -->
  <g stroke="#a778e8" stroke-width="1.6" fill="none">
    <path d="M304,120 C340,120 340,120 380,120" marker-end="url(#arrow2)"/>
  </g>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a778e8"/>
    </marker>
  </defs>

  <!-- .zshrc load order -->
  <rect x="380" y="30" width="296" height="330" rx="10" fill="#171226" stroke="#a778e8" stroke-width="1.5"/>
  <text x="528" y="58" font-size="13" fill="#c39bf5" text-anchor="middle" font-weight="bold">.zshrc, in this exact order</text>

  <rect x="398" y="76" width="14" height="14" rx="3" fill="#63d8c8"/>
  <text x="420" y="88" font-size="11" fill="#d8d4e4">zsh-syntax-highlighting.zsh</text>
  <rect x="398" y="100" width="14" height="14" rx="3" fill="#63d8c8"/>
  <text x="420" y="112" font-size="11" fill="#d8d4e4">zsh-autosuggestions.zsh</text>

  <rect x="398" y="128" width="14" height="14" rx="3" fill="#f0b45f"/>
  <text x="420" y="140" font-size="11" fill="#d8d4e4">① hacking.zsh</text>
  <rect x="398" y="152" width="14" height="14" rx="3" fill="#f0b45f"/>
  <text x="420" y="164" font-size="11" fill="#d8d4e4">② aliases.zsh</text>
  <rect x="398" y="176" width="14" height="14" rx="3" fill="#f0b45f"/>
  <text x="420" y="188" font-size="11" fill="#d8d4e4">③ environment.zsh</text>

  <line x1="398" y1="210" x2="660" y2="210" stroke="#2e2547"/>

  <rect x="398" y="226" width="14" height="14" rx="3" fill="#6fe3a1"/>
  <text x="420" y="238" font-size="11" fill="#6fe3a1" font-weight="bold">eval "$(starship init zsh)"</text>
  <text x="420" y="258" font-size="10" fill="#5a5470">last, so it wraps whatever state</text>
  <text x="420" y="274" font-size="10" fill="#5a5470">everything above already set</text>

  <text x="398" y="320" font-size="11" fill="#5a5470"># source $ZSH/oh-my-zsh.sh</text>
  <text x="398" y="340" font-size="10" fill="#5a5470">commented out. only the plugin</text>
  <text x="398" y="356" font-size="10" fill="#5a5470">loading pattern gets borrowed.</text>
</svg>
